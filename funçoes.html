<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <script>

        //declaração de funçao
        function ola(){
         document.write("ola mundo")
         }

         ola()

        //expressao de funçao

         const ola2 = function (){
         console.log("ola mundo de function expression")
        }

         ola2()

         //arrow functions

         const ola3 = () => {
            console.log("ola mundo de function expression")
         }
         ola3()

        </script>
</body>
</html>
