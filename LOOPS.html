<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>while - for</title>
</head>
<body>



    <script>
        let numero = prompt("Digite um numero")

        let indice = 0
         
        while(indice <= 10){
                
            document.write(`${indice} x ${numero} = ${(indice * numero)} <br>`)
            indice++

        document.write("saiu do loop while <br>")
        }




        for (let j = 0 ; j <= 10 ; j++){
            if(j ===5){
                continue
            }
            
            document.write(`${numero} x ${j} = ${(j * numero)} <br>`)
        }    
        document.write("saiu do loop for")



        do{
            if(indice > 10){
                alert ("indice maior que 10")
                break
            }

                document.write(`${indice} x ${numero} = ${(indice * numero)} <br>`)
                indice++
                    
        }while(indice <= 10)            
                    
          
                    

        document.write("saiu do loop while <br>") 

        </script>

        
</body>
</html>
